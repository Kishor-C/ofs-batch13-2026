<div class="oj-hybrid-padding">
  <h1>Dashboard Content Area</h1>
  <div>
    To change the content of this section, you will make edits to the
    dashboard.html file located in the /ts/views folder.
  </div>
  <div>
    <h1>JSON Placeholder data</h1>
    <oj-table
      id="table"
      aria-label="Users Table"
      data="[[dataprovider]]"
      columns='[{"headerText": "Id", "field": "id" },
                        {"headerText": "Name", "field": "name"},
                        {"headerText": "Username", "field": "username"},
                        {"headerText": "Email", "field": "email"}]'
    ></oj-table>
    <h1>Input Text</h1>
    <oj-c-input-text
      raw-value="{{username}}"
      value="{{username}}"
      label-hint="Enter username"
      label-edge="inside"
    ></oj-c-input-text>
    <p>Username is: <oj-bind-text value="[[username]]"></oj-bind-text></p>
    <!-- Create a button below this and when you click on button,
      it must alert a message-->
  </div>
</div>
