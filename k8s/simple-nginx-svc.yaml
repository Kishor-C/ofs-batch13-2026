apiVersion: v1
kind: Pod
metadata:
  name: nginx-isolated-pod
  labels:
    app: nginx-standalone
spec:
  containers:
    - name: nginx
      image: nginx:latest
      ports:
        - containerPort: 80 # Nginx web server inherently listens on port 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport-service
spec:
  type: NodePort 
  selector:
    app: nginx-standalone 
  ports:
    - protocol: TCP
      port: 80         # CHANGED: Match the application type (80 for web instead of 6379 Redis port)
      targetPort: 80   # Matches the containerPort above
      nodePort: 32001  # Clean external port
